name: Database Push

on:
  push:
    branches:
      - master

jobs:
  db-push:
    name: Push Database Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install

      - name: Push schema
        run: bun run db:push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
